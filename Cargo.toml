[package]
name = "coretuner"
version = "1.0.0"
edition = "2021"
description = "CoreTuner — CPU affinity & priority manager for Windows"

[dependencies]
anyhow = "1"
crossbeam-channel = "0.5"
eframe = "0.37"
egui = "0.37"
image = { version = "0.25", default-features = false, features = ["png"] }
muda = "0.21"
rfd = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = "0.3"
tray-icon = "0.26"
windows = { version = "0.62", features = [
  "Win32_Foundation", "Win32_Security", "Win32_System_Threading", "Win32_System_SystemInformation",
  "Win32_System_ProcessStatus", "Win32_System_Diagnostics_ToolHelp", "Win32_System_LibraryLoader",
  "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_Graphics_Gdi", "Win32_Storage_FileSystem",
  "Win32_UI_Controls", "Win32_System_Registry", "Win32_Security_Authorization", "Win32_System_Memory",
  "Win32_System_SystemServices",
] }
winreg = "0.56"

[build-dependencies]
winres = "0.1"

[profile.release]
lto = true
strip = true
codegen-units = 1
panic = "abort"
opt-level = 3
